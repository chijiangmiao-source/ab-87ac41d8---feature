services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: avionics-isolation-review:latest
    container_name: avionics-review-app
    # 可配置宿主端口：HOST_PORT（默认 8080）映射到容器 8080
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      HEALTH_PATH: ${HEALTH_PATH:-/healthz}
    restart: unless-stopped

  # 一次性验收服务：代码测试（分支遗漏释放 / abort 嵌套清理 / 循环重复获取）
  # + 构建检查 + HTTP 冒烟（健康地址 & 静态页面 & 三场景 API 复核）；
  # 运行结束即以退出码报告（0 通过 / 非 0 失败），不常驻。
  # 运行： docker compose run --rm verify   （或 docker compose up verify）
  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: avionics-isolation-review:verify
    container_name: avionics-review-verify
    command: ["node", "scripts/verify.js"]
    environment:
      HEALTH_PATH: ${HEALTH_PATH:-/healthz}
      APP_BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
